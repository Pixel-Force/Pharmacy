<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e2f"/>
      <stop offset="50%" stop-color="#0f2b3e"/>
      <stop offset="100%" stop-color="#064e4b"/>
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-main" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg-grad)"/>

  <!-- Decorative Ambient Circles -->
  <circle cx="200" cy="100" r="280" fill="#0d9488" opacity="0.12"/>
  <circle cx="1050" cy="550" r="320" fill="#10b981" opacity="0.08"/>

  <!-- Brand Title Top -->
  <g transform="translate(60, 48)">
    <rect width="40" height="40" rx="8" fill="url(#primary-grad)"/>
    <text x="20" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">+</text>
    <text x="54" y="28" font-family="'Outfit', sans-serif" font-weight="800" font-size="24" fill="#ffffff">Cura<tspan fill="#2dd4bf">Rx</tspan></text>
    <text x="144" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#94a3b8">| Licensed Online Pharmacy &amp; Wellness</text>
    <rect x="1000" y="2" width="140" height="32" rx="16" fill="rgba(45,212,191,0.15)" stroke="#2dd4bf" stroke-width="1"/>
    <text x="1070" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#5eead4" text-anchor="middle">Lic #RPH-942817</text>
  </g>

  <!-- 1. DESKTOP BROWSER FRAME -->
  <g transform="translate(60, 95)" filter="url(#shadow-main)">
    <!-- Window Outer Shell -->
    <rect width="780" height="530" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <path d="M 0 16 Q 0 0 16 0 L 764 0 Q 780 0 780 16 L 780 44 L 0 44 Z" fill="#0f172a"/>
    <circle cx="22" cy="22" r="5" fill="#ef4444"/>
    <circle cx="38" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="54" cy="22" r="5" fill="#10b981"/>
    <!-- URL Bar -->
    <rect x="140" y="10" width="500" height="24" rx="12" fill="#1e293b"/>
    <text x="390" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#94a3b8" text-anchor="middle">https://curarx-pharmacy.com/shop.html</text>

    <!-- Browser Content -->
    <!-- Announcement Mini -->
    <rect x="0" y="44" width="780" height="22" fill="#064e4b"/>
    <text x="390" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#ccfbf1" text-anchor="middle">Free Expedited Cold-Chain Delivery on all orders over $45.00 • 24/7 Pharmacist On-Call</text>

    <!-- Header bar -->
    <rect x="0" y="66" width="780" height="54" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
    <text x="30" y="99" font-family="'Outfit', sans-serif" font-weight="800" font-size="18" fill="#0f172a">Cura<tspan fill="#0d9488">Rx</tspan></text>
    <!-- Search pill -->
    <rect x="130" y="78" width="360" height="30" rx="15" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="150" y="97" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">Search medicines, generic ingredients, brands...</text>
    <!-- Buttons -->
    <rect x="520" y="78" width="130" height="30" rx="15" fill="url(#primary-grad)"/>
    <text x="585" y="97" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">+ Upload Script</text>
    <rect x="665" y="78" width="95" height="30" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="712" y="97" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#0f172a" text-anchor="middle">Cart (2)</text>

    <!-- Hero Content in Browser -->
    <rect x="0" y="120" width="780" height="150" fill="url(#bg-grad)"/>
    <rect x="30" y="136" width="190" height="18" rx="9" fill="rgba(255,255,255,0.15)"/>
    <text x="125" y="149" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#5eead4" text-anchor="middle">Licensed Clinical Dispensary</text>
    
    <text x="30" y="184" font-family="'Outfit', sans-serif" font-weight="800" font-size="28" fill="#ffffff">Your Health, <tspan fill="#2dd4bf">Our Priority.</tspan></text>
    <text x="30" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">100% Genuine prescription drugs, OTC remedies &amp; cold-chain certified delivery.</text>
    
    <rect x="30" y="222" width="115" height="32" rx="16" fill="url(#primary-grad)"/>
    <text x="87" y="242" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">Shop Medicines</text>
    <rect x="155" y="222" width="125" height="32" rx="16" fill="#ffffff"/>
    <text x="217" y="242" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#0f172a" text-anchor="middle">Upload Prescription</text>

    <!-- Mini Product Cards Grid inside Browser -->
    <rect x="0" y="270" width="780" height="260" fill="#f8fafc"/>
    <text x="30" y="296" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#0f172a">Featured Medications &amp; Essentials</text>

    <!-- Card 1 (Rx) -->
    <g transform="translate(30, 312)" filter="url(#shadow-card)">
      <rect width="225" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="10" y="10" width="205" height="90" rx="8" fill="#f1f5f9"/>
      <rect x="16" y="16" width="75" height="18" rx="9" fill="#0f766e"/>
      <text x="53" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" fill="#ffffff" text-anchor="middle">Rx Required</text>
      <!-- Medicine illustration placeholder -->
      <circle cx="112" cy="55" r="24" fill="#0d9488" opacity="0.2"/>
      <rect x="102" y="45" width="20" height="20" rx="4" fill="#0d9488"/>

      <text x="14" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0d9488">PRESCRIPTION</text>
      <text x="14" y="138" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#0f172a">Amoxicillin 500mg</text>
      <text x="14" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b">21 Capsules • Sandoz</text>
      <text x="14" y="186" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#0f172a">$18.50</text>
      <rect x="175" y="166" width="36" height="28" rx="6" fill="url(#primary-grad)"/>
      <text x="193" y="184" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">+</text>
    </g>

    <!-- Card 2 (Rx) -->
    <g transform="translate(275, 312)" filter="url(#shadow-card)">
      <rect width="225" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="10" y="10" width="205" height="90" rx="8" fill="#f1f5f9"/>
      <rect x="16" y="16" width="75" height="18" rx="9" fill="#0f766e"/>
      <text x="53" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" fill="#ffffff" text-anchor="middle">Rx Required</text>
      <circle cx="112" cy="55" r="24" fill="#2563eb" opacity="0.2"/>
      <rect x="102" y="45" width="20" height="20" rx="4" fill="#2563eb"/>

      <text x="14" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0d9488">PRESCRIPTION</text>
      <text x="14" y="138" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#0f172a">Atorvastatin 20mg</text>
      <text x="14" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b">30 Tablets • Pfizer</text>
      <text x="14" y="186" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#0f172a">$22.00</text>
      <rect x="175" y="166" width="36" height="28" rx="6" fill="url(#primary-grad)"/>
      <text x="193" y="184" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">+</text>
    </g>

    <!-- Card 3 (OTC) -->
    <g transform="translate(520, 312)" filter="url(#shadow-card)">
      <rect width="225" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="10" y="10" width="205" height="90" rx="8" fill="#f1f5f9"/>
      <rect x="16" y="16" width="55" height="18" rx="9" fill="#0284c7"/>
      <text x="43" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" fill="#ffffff" text-anchor="middle">OTC Care</text>
      <circle cx="112" cy="55" r="24" fill="#10b981" opacity="0.2"/>
      <rect x="102" y="45" width="20" height="20" rx="4" fill="#10b981"/>

      <text x="14" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0284c7">OVER THE COUNTER</text>
      <text x="14" y="138" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#0f172a">Panadol Extra 500mg</text>
      <text x="14" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b">32 Caplets • Fast Relief</text>
      <text x="14" y="186" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#0f172a">$8.95</text>
      <rect x="175" y="166" width="36" height="28" rx="6" fill="url(#primary-grad)"/>
      <text x="193" y="184" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">+</text>
    </g>
  </g>

  <!-- 2. MOBILE PHONE FRAME (Right Showcase) -->
  <g transform="translate(875, 115)" filter="url(#shadow-main)">
    <!-- Phone Bezel -->
    <rect width="260" height="505" rx="34" fill="#0f172a" stroke="#334155" stroke-width="4"/>
    <rect x="8" y="8" width="244" height="489" rx="28" fill="#ffffff"/>

    <!-- Dynamic Island / Speaker notch -->
    <rect x="85" y="16" width="90" height="18" rx="9" fill="#0f172a"/>

    <!-- Mobile Screen Header -->
    <rect x="8" y="40" width="244" height="46" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
    <text x="24" y="68" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#0f172a">Cura<tspan fill="#0d9488">Rx</tspan></text>
    <circle cx="230" cy="63" r="13" fill="#f1f5f9"/>
    <text x="230" y="67" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#0f172a" text-anchor="middle">🛒</text>

    <!-- Mobile Rx Upload Card -->
    <g transform="translate(20, 96)">
      <rect width="220" height="175" rx="16" fill="url(#primary-grad)"/>
      <text x="18" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#ffffff">Have a Prescription?</text>
      <text x="18" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#ccfbf1">Upload doctor's script for 15-min review</text>
      
      <!-- Upload inner button -->
      <rect x="18" y="62" width="184" height="60" rx="10" fill="#ffffff" opacity="0.15" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="110" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" text-anchor="middle">📷</text>
      <text x="110" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">Snap &amp; Upload Photo</text>

      <rect x="18" y="132" width="184" height="28" rx="14" fill="#ffffff"/>
      <text x="110" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#0f766e" text-anchor="middle">Start Rx Verification</text>
    </g>

    <!-- Mobile Prescription Status Live Card -->
    <g transform="translate(20, 285)">
      <rect width="220" height="140" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#0f172a">Prescription #RX-2026-9812</text>
      <rect x="14" y="32" width="85" height="16" rx="8" fill="#d1fae5"/>
      <text x="56" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8" fill="#065f46" text-anchor="middle">VERIFIED PHARMD</text>

      <text x="14" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#475569">Dr. Jonathan Hayes, MD</text>
      <text x="14" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0d9488" font-weight="700">Atorvastatin 20mg (30 tabs)</text>
      <text x="14" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#64748b">Verified by: Dr. Eleanor Vance, PharmD</text>

      <rect x="14" y="106" width="192" height="22" rx="11" fill="#0f172a"/>
      <text x="110" y="121" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#ffffff" text-anchor="middle">Track Cold-Chain Courier</text>
    </g>

    <!-- Mobile Bottom Navigation Bar -->
    <rect x="8" y="445" width="244" height="52" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="35" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#0d9488" text-anchor="middle">🏠</text>
    <text x="80" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">💊</text>
    <!-- Center floating Rx button -->
    <circle cx="130" cy="460" r="18" fill="url(#primary-grad)"/>
    <text x="130" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">℞</text>
    <text x="180" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">🚚</text>
    <text x="225" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">👤</text>
  </g>
</svg>
